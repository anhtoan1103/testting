<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVRN-1690 SPA</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-bootstrap/2.8.0/react-bootstrap.min.js"></script>
  <script crossorigin src="https://unpkg.com/@remix-run/router@1.13.0/dist/router.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-router@6.20.0/dist/umd/react-router.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-router-dom@6.20.0/dist/umd/react-router-dom.production.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.10/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Modal, Button, Form, Alert, Table, Navbar, Nav, Container, Card } = ReactBootstrap;
    const { BrowserRouter, HashRouter, Routes, Route, Link, NavLink, useNavigate } = ReactRouterDOM;

    function Layout({ children }) {
      return (
        <>
          <Navbar bg="dark" variant="dark" expand="md" className="mb-4">
            <Container>
              <Navbar.Brand as={Link} to="/">SVRN-1690 SPA</Navbar.Brand>
              <Navbar.Toggle />
              <Navbar.Collapse>
                <Nav>
                  <Nav.Link as={NavLink} to="/" end>Home</Nav.Link>
                  <Nav.Link as={NavLink} to="/merchants">Merchants</Nav.Link>
                  <Nav.Link as={NavLink} to="/about">About</Nav.Link>
                </Nav>
              </Navbar.Collapse>
            </Container>
          </Navbar>
          <Container>{children}</Container>
        </>
      );
    }

    function HomePage() {
      return (
        <Card className="p-4">
          <h2>Welcome</h2>
          <p>This is a small single-page application demonstrating the SVRN-1690 modal auto-close issue.</p>
          <p>Use the navigation above to move between pages — notice the URL changes but the page never reloads.</p>
          <ul>
            <li><Link to="/merchants">Merchants</Link> — search modal that reproduces the bug</li>
            <li><Link to="/about">About</Link> — background on the issue</li>
          </ul>
        </Card>
      );
    }

    function AboutPage() {
      return (
        <Card className="p-4">
          <h2>About SVRN-1690</h2>
          <p>
            A customer page calls <code>e.preventDefault()</code> <em>after</em> an <code>await</code>,
            so the browser natively submits the form before React can stop it. The resulting page
            navigation looks like a modal "auto-close" but is actually a full reload.
          </p>
          <p>
            The fix on the customer side is to call <code>preventDefault()</code> synchronously
            before any async work.
          </p>
        </Card>
      );
    }

    function MerchantsPage() {
      const [show, setShow] = useState(false);
      const [loading, setLoading] = useState(false);
      const [results, setResults] = useState(false);
      const [selected, setSelected] = useState([]);

      const handleShow = () => {
        setShow(true);
        setLoading(false);
        setResults(false);
        setSelected([]);
      };
      const handleClose = () => setShow(false);

      const handleSearch = async (e) => {
        // Anti-pattern from SVRN-1690: preventDefault is called AFTER await
        setLoading(true);
        await new Promise(r => setTimeout(r, 1500));
        setLoading(false);
        setResults(true);
        e.preventDefault();
      };

      const toggleSelect = (code) => {
        setSelected(s => s.includes(code) ? s.filter(c => c !== code) : [...s, code]);
      };

      return (
        <Card className="p-4">
          <h2>Merchant Search</h2>
          <Alert variant="info">
            Click <strong>加盟店選択</strong> to open the search modal, then click <strong>検索</strong>.
            If the page flashes red, the form natively submitted — that is the SVRN-1690 bug.
          </Alert>
          <Button variant="primary" onClick={handleShow}>加盟店選択 (Open Modal)</Button>

          {selected.length > 0 && (
            <div className="mt-4">
              <h5>Selected ({selected.length})</h5>
              <ul>{selected.map(c => <li key={c}>{c}</li>)}</ul>
            </div>
          )}

          <Modal show={show} onHide={handleClose} size="lg">
            <Modal.Header closeButton>
              <Modal.Title>加盟店検索 (Merchant Search)</Modal.Title>
            </Modal.Header>
            <Modal.Body style={{ minHeight: '300px' }}>
              {loading ? (
                <div className="p-5 text-center fs-4 text-primary">検索中... (Searching...)</div>
              ) : results ? (
                <Table striped bordered hover>
                  <thead>
                    <tr><th></th><th>FGサブ加盟店コード</th><th>FGサブ加盟店名</th></tr>
                  </thead>
                  <tbody>
                    {[
                      { code: 'FS001000280', name: 'ブルワリー' },
                      { code: 'FS001000279', name: 'ＶＥＧＥＧＯ' },
                    ].map(row => (
                      <tr key={row.code}>
                        <td>
                          <Form.Check
                            checked={selected.includes(row.code)}
                            onChange={() => toggleSelect(row.code)}
                          />
                        </td>
                        <td>{row.code}</td>
                        <td>{row.name}</td>
                      </tr>
                    ))}
                  </tbody>
                </Table>
              ) : (
                <Form onSubmit={handleSearch}>
                  <Form.Group className="mb-3">
                    <Form.Label>FGサブ加盟店コード</Form.Label>
                    <Form.Control type="text" placeholder="Enter code" />
                  </Form.Group>
                  <Form.Group className="mb-3">
                    <Form.Label>FGサブ加盟店名</Form.Label>
                    <Form.Control type="text" placeholder="Enter name" />
                  </Form.Group>
                  <div className="d-flex justify-content-end mt-4">
                    <Button variant="secondary" className="me-2" type="button">クリア (Clear)</Button>
                    <Button variant="primary" type="submit">検索 (Search)</Button>
                  </div>
                </Form>
              )}
            </Modal.Body>
            {results && (
              <Modal.Footer>
                <Button variant="secondary" onClick={handleClose}>Cancel</Button>
                <Button variant="primary" onClick={handleClose} disabled={selected.length === 0}>
                  Confirm ({selected.length})
                </Button>
              </Modal.Footer>
            )}
          </Modal>
        </Card>
      );
    }

    function NotFoundPage() {
      return (
        <Card className="p-4">
          <h2>404</h2>
          <p>That page doesn't exist. <Link to="/">Go home</Link>.</p>
        </Card>
      );
    }

    function App() {
      return (
        <BrowserRouter>
          <Layout>
            <Routes>
              <Route path="/" element={<HomePage />} />
              <Route path="/merchants" element={<MerchantsPage />} />
              <Route path="/about" element={<AboutPage />} />
              <Route path="*" element={<NotFoundPage />} />
            </Routes>
          </Layout>
        </BrowserRouter>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
