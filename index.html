<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVRN-1690 modal repro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  body { background: #f5f7fb; font-family: system-ui, -apple-system, sans-serif; }
  .controls { padding: 24px; max-width: 980px; margin: 0 auto; }
  pre.log { background: #111; color: #c8e6c9; padding: 10px; border-radius: 4px; max-height: 240px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  .results-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 8px; font-size: 13px; }
  .results-meta button { padding: 2px 8px; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .results-meta button.active { background: #18488a; color: #fff; border-color: #18488a; }
  .results-meta button[disabled] { opacity: 0.5; }
  table.results { width: 100%; border-collapse: collapse; }
  table.results th, table.results td { padding: 6px 12px; font-size: 13px; border-bottom: 1px solid #eee; text-align: left; }
  .badge-state { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #e3f2fd; color: #18488a; margin-left: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/react-bootstrap@2.10.4/dist/react-bootstrap.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel">
const { Modal, Button, Form, Row, Col } = ReactBootstrap;

function tsNow() {
  const d = new Date();
  return d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

function logEvent(line, kind) {
  const el = document.getElementById('event-log');
  if (!el) return;
  const color = kind === 'close' ? '#ff8a80' : kind === 'open' ? '#9be7a8' : '#c8e6c9';
  el.innerHTML =
    '<span style="color:' + color + '">[' + tsNow() + '] ' + line + '</span>\n' + el.innerHTML;
}

function ResultsTable() {
  const rows = [
    { code: 'FS001000262', name: 'マクドナルド', kana: 'マクドナルド' },
    { code: 'FS001000261', name: 'テナント研修2', kana: 'テナントケンシュウ2' },
    { code: 'FS001000260', name: 'テナント研修1', kana: 'テナントケンシュウ1' },
    { code: 'FS001000259', name: '催事ワゴン24', kana: 'サイジワゴン24' },
    { code: 'FS001000258', name: '催事ワゴン23', kana: 'サイジワゴン23' },
    { code: 'FS001000257', name: 'TOWER RECORDS mini', kana: 'タワーレコーズミニ' },
    { code: 'FS001000256', name: 'ダイソー・Standard Products・THREEPPY', kana: 'ダイソー' },
    { code: 'FS001000255', name: '催事ワゴン19', kana: 'サイジワゴン19' },
    { code: 'FS001000254', name: '催事ワゴン18', kana: 'サイジワゴン18' },
    { code: 'FS001000253', name: '催事ワゴン17', kana: 'サイジワゴン17' },
  ];
  return (
    <div className="modal-sub-body">
      <div className="results-meta">
        <span>総件数: 148</span>
        <button disabled>最初</button>
        <button disabled>前へ</button>
        <button className="active">1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
        <button>5</button>
        <button>次へ</button>
        <button>最後</button>
      </div>
      <table className="results">
        <thead><tr><th>FGサブ加盟店コード</th><th>FGサブ加盟店名</th><th>FGサブ加盟店名カナ</th></tr></thead>
        <tbody>
          {rows.map(r => (
            <tr key={r.code}><td>{r.code}</td><td>{r.name}</td><td>{r.kana}</td></tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function SearchModal({ show, onHide }) {
  const [hasResults, setHasResults] = React.useState(false);

  React.useEffect(() => {
    if (show) setHasResults(false);
  }, [show]);

  const handleSubmit = (e) => {
    e.preventDefault();
    logEvent('form submit fired → simulating server response in 800 ms');
    setTimeout(() => {
      logEvent('response arrived → setHasResults(true), results table renders inside modal-body');
      setHasResults(true);
    }, 800);
  };

  return (
    <Modal
      show={show}
      onHide={() => { logEvent('Modal onHide() called', 'close'); onHide(); }}
      onShow={() => logEvent('Modal onShow', 'open')}
      onEntered={() => logEvent('Modal onEntered (transition complete, modal fully open)')}
      onExited={() => logEvent('Modal onExited (transition complete, modal fully closed)', 'close')}
      size="lg"
      centered
      backdrop={true}
      keyboard={true}
    >
      <Modal.Header closeButton>
        <Modal.Title>サブ加盟店検索</Modal.Title>
      </Modal.Header>
      <Modal.Body>
        <Form onSubmit={handleSubmit}>
          <Row>
            <Col xs={6}>
              <Form.Group className="mb-3">
                <Form.Label>
                  FGサブ加盟店コード{' '}
                  <span style={{ fontSize: '0.8em', color: '#6c757d' }}>(完全一致)</span>
                </Form.Label>
                <Form.Control type="text" maxLength={11} />
              </Form.Group>
            </Col>
          </Row>
          <Row>
            <Col xs={6}>
              <Form.Group className="mb-3">
                <Form.Label>
                  FGサブ加盟店名{' '}
                  <span style={{ fontSize: '0.8em', color: '#6c757d' }}>(部分一致)</span>
                </Form.Label>
                <Form.Control type="text" maxLength={40} />
              </Form.Group>
            </Col>
            <Col xs={6}>
              <Form.Group className="mb-3">
                <Form.Label>
                  FGサブ加盟店名カナ{' '}
                  <span style={{ fontSize: '0.8em', color: '#6c757d' }}>(部分一致)</span>
                </Form.Label>
                <Form.Control type="text" maxLength={40} />
              </Form.Group>
            </Col>
          </Row>
          <hr />
          <div className="d-flex justify-content-end">
            <Button variant="outline-secondary" type="button" className="me-2">クリア</Button>
            <Button variant="primary" type="submit">検索</Button>
          </div>
        </Form>
        {hasResults && <ResultsTable />}
      </Modal.Body>
    </Modal>
  );
}

function App() {
  const [show, setShow] = React.useState(true);

  return (
    <div className="controls">
      <h4>SVRN-1690 — sub-merchant search modal repro</h4>
      <p className="text-muted">
        Real React 18 + react-bootstrap Modal mimicking the
        partnerlink-ikspiari.gmo-fg.com flow. The modal opens automatically.
        Click <strong>検索</strong> — ~800 ms later the results table renders
        inside the same modal-body. Watch whether the modal stays open
        (expected) or auto-closes (the bug).
      </p>
      <Button onClick={() => setShow(true)} disabled={show}>Re-open modal</Button>
      <span className="badge-state">modal: {show ? 'open' : 'closed'}</span>
      <h6 className="mt-4">Event log <small className="text-muted">(most recent at top)</small></h6>
      <pre id="event-log" className="log"></pre>
      <SearchModal show={show} onHide={() => setShow(false)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
